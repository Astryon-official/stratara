<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.astyrion.Xodus"/>
    <allow send_destination="org.astyrion.Xodus"/>
    <allow send_interface="org.astyrion.Xodus"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.astyrion.Xodus"/>
    <allow send_interface="org.astyrion.Xodus"/>
  </policy>

  <policy at_console="true">
    <allow send_destination="org.astyrion.Xodus"/>
    <allow send_interface="org.astyrion.Xodus"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.astyrion.Xodus"/>
    <allow send_interface="org.astyrion.Xodus"/>
  </policy>
</busconfig>