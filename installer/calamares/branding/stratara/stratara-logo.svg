<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#iconGrad)" stroke-width="4" opacity="0.3"/>
  
  <!-- Inner ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#iconGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- TV/Screen shape -->
  <rect x="58" y="58" width="140" height="100" rx="12" fill="url(#iconGrad)" filter="url(#glow)"/>
  
  <!-- Screen content - Stratara "S" -->
  <text x="128" y="132" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="#0a0a0c" text-anchor="middle" dominant-baseline="middle">S</text>
  
  <!-- Signal waves (TV broadcast symbol) -->
  <g fill="none" stroke="#00aaff" stroke-width="2" opacity="0.7">
    <path d="M 198 128 Q 210 110 222 128 Q 234 146 222 128"/>
    <path d="M 198 128 Q 210 130 222 128 Q 234 126 222 128" opacity="0.5"/>
    <path d="M 198 128 Q 210 150 222 128 Q 234 106 222 128" opacity="0.3"/>
  </g>
  
  <!-- Bottom indicator -->
  <rect x="108" y="184" width="40" height="4" rx="2" fill="url(#iconGrad)" opacity="0.8"/>
</svg>