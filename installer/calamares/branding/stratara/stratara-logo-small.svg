<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- TV/Screen shape -->
  <rect x="12" y="12" width="40" height="28" rx="4" fill="url(#iconGrad)" filter="url(#glow)"/>
  
  <!-- Screen content - Stratara "S" -->
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="#0a0a0c" text-anchor="middle" dominant-baseline="middle">S</text>
  
  <!-- Signal waves -->
  <g fill="none" stroke="#00aaff" stroke-width="1.5" opacity="0.7">
    <path d="M 50 32 Q 54 26 58 32 Q 62 38 58 32"/>
  </g>
</svg>