<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="55" fill="none" stroke="url(#iconGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- TV/Screen shape -->
  <rect x="28" y="28" width="72" height="52" rx="8" fill="url(#iconGrad)" filter="url(#glow)"/>
  
  <!-- Screen content - Stratara "S" -->
  <text x="64" y="68" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#0a0a0c" text-anchor="middle" dominant-baseline="middle">S</text>
  
  <!-- Signal waves (TV broadcast symbol) -->
  <g fill="none" stroke="#00aaff" stroke-width="1.5" opacity="0.7">
    <path d="M 98 64 Q 104 54 110 64 Q 116 74 110 64"/>
    <path d="M 98 64 Q 104 58 110 64 Q 116 70 110 64" opacity="0.5"/>
  </g>
  
  <!-- Bottom indicator -->
  <rect x="54" y="96" width="20" height="3" rx="1.5" fill="url(#iconGrad)" opacity="0.8"/>
</svg>