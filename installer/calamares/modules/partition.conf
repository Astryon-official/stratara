# Partition module configuration for Stratara OS

# Required page
required: true

# Minimum disk size (GB)
minimumSize: 8.0

# Recommended disk size (GB)
recommendSize: 20.0

# Default filesystem
defaultFilesystem: "ext4"

# Available filesystems
filesystems:
    - "ext4"
    - "btrfs"
    - "xfs"
    - "f2fs"

# Mount point choices
mountPoints:
    - "/"
    - "/boot"
    - "/home"
    - "/var"
    - "swap"

# Default partition scheme
defaultScheme: "auto"

# Auto partition options
autoPartition:
    # Create swap partition
    swap: true
    # Swap size (GB or "auto")
    swapSize: "auto"
    # Create home partition
    home: true
    # Home size percentage
    homeSize: 50

# LVM support
lvm: false

# LUKS encryption
luks:
    enabled: false
    default: false

# EFI system partition
efi:
    required: true
    size: 512  # MB
    filesystem: "fat32"

# Boot partition
boot:
    required: false
    size: 1024  # MB
    filesystem: "ext4"

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"

# Warning color
warningColor: "#ffaa00"

# Error color
errorColor: "#ff4444"