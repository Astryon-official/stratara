# Summary module configuration for Stratara OS

# Required page
required: true

# Show installation log
showInstallLog: true

# Show detailed installation info
showInstallDetails: true

# Show installation slides
showSlides: true

# Slides configuration (shown during installation)
slides:
    - title: "Welcome to Stratara OS"
      description: |
          Stratara OS is a Linux-native living-room shell designed for TV
          and controller-based interaction. Enjoy a console-like experience
          on your Linux system.
      image: "slide1.png"
    - title: "Controller-First Navigation"
      description: |
          Navigate your media, apps, and settings with a game controller
          or TV remote. No keyboard or mouse required.
      image: "slide2.png"
    - title: "Media Center Ready"
      description: |
          Built-in support for MPRIS media players, PipeWire audio,
          and network streaming. Your living room entertainment hub.
      image: "slide3.png"
    - title: "System Integration"
      description: |
          Full system integration with NetworkManager, Bluetooth,
          systemd, and Xodus for seamless device management.
      image: "slide4.png"
    - title: "Open Source"
      description: |
          Stratara OS is free and open source software. Join the community
          at github.com/Astryon-official/Stratara
      image: "slide5.png"

# Slide transition time (seconds)
slideTime: 15

# Show progress bar during install
showProgress: true

# Show detailed progress
showDetails: true

# Confirmation message before install
confirmMessage: |
    Ready to install Stratara OS. This will partition your disk
    and install the system. This action cannot be undone.

# Install button label
installLabel: "Install Now"

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"

# Progress bar color
progressColor: "#00aaff"