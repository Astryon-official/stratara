# Finished module configuration for Stratara OS

# Required page
required: true

# Reboot options
rebootNow: true
rebootLater: true

# Default to reboot now
rebootNowDefault: true

# Show installation log
showLog: true

# Restart message
message: |
    Stratara OS has been successfully installed!
    
    Please restart your computer to start using Stratara OS.
    The system will boot into the Stratara living-room shell
    automatically.
    
    If you chose OEM installation, the first-boot setup
    will guide you through creating your user account
    and configuring your system.

# Message for successful installation
successMessage: "Installation completed successfully!"

# Message for failed installation
failureMessage: "Installation failed. Please check the log for details."

# Button labels
restartLabel: "Restart Now"
laterLabel: "Restart Later"

# Show log button
showLogLabel: "Show Installation Log"

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"

# Success color
successColor: "#44aa44"

# Background image
background: "finished-bg.png"

# Logo
logo: "stratara-logo.svg"

# OEM mode message
oemMessage: |
    OEM installation completed.
    The system will boot into the first-boot setup
    on next startup.