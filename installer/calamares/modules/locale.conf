# Locale module configuration for Stratara OS

# Required page
required: true

# Show all available locales (not just common ones)
showAllLocales: false

# Default locale
defaultLocale: "en_US.UTF-8"

# Region filter (empty = all regions)
regions: []

# Timezone configuration
timezone:
    # Show timezone map
    showMap: true
    # Default timezone
    default: "UTC"
    # Use system timezone if available
    useSystem: true

# Locale format
localeFormat: "locale.UTF-8"

# Enable locale generation
generate: true

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"