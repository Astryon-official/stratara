# Install module configuration for Stratara OS

# Required page
required: true

# Use rsync for copying files
useRsync: true

# Rsync options
rsyncOptions: "-aHAX --info=progress2"

# Show progress during copy
showProgress: true

# Show detailed file copy progress
showDetails: true

# Verify files after copy
verify: true

# Skip verification for speed (not recommended)
skipVerify: false

# Bootloader installation
bootloader:
    # Install GRUB
    install: true
    # GRUB timeout
    timeout: 5
    # GRUB resolution
    resolution: "1920x1080"
    # GRUB theme
    theme: "/usr/share/grub/themes/stratara/theme.txt"
    # EFI installation
    efi: true
    # Secure Boot
    secureBoot: false

# Initramfs generation
initramfs:
    # Generate initramfs
    generate: true
    # Compression
    compression: "zstd"
    # Host-only initramfs
    hostOnly: true

# Systemd services to enable
services:
    - "stratara.service"  # User service
    - "xodus.service"     # System service
    - "NetworkManager.service"
    - "bluetooth.service"
    - "pipewire.service"
    - "pipewire-pulse.service"
    - "dbus.service"

# Post-install scripts
postInstallScripts:
    - "/usr/share/stratara/post-install.sh"

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"

# Success color
successColor: "#44aa44"

# Error color
errorColor: "#ff4444"