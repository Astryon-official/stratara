# Stratara OEM Module
# Custom Calamares module for Stratara OEM/first-boot setup

name: "stratara-oem"
description: "Stratara OEM post-install configuration"
version: "0.1.0"
author: "Astryon"

# Module type
type: "oem"

# Run after install module
order: "post-install"

# Configuration
config:
    # Enable OEM mode
    enabled: true
    
    # First boot setup
    firstBoot:
        # Show welcome screen
        welcome: true
        # Network setup wizard
        network: true
        # User account creation
        userAccount: true
        # Timezone/locale setup
        locale: true
        # Keyboard setup
        keyboard: true
        # Display setup
        display: true
        # Xodus enrollment
        xodusEnrollment: true
    
    # Default settings for OEM
    defaults:
        # Auto-login for OEM user
        autologin: true
        # Default user for OEM
        defaultUser: "stratara"
        # Default password (empty = prompt on first boot)
        defaultPassword: ""
        # Hostname prefix
        hostnamePrefix: "stratara-"
        # Timezone
        timezone: "UTC"
        # Locale
        locale: "en_US.UTF-8"
        # Keyboard layout
        keyboardLayout: "us"
        # Keyboard variant
        keyboardVariant: ""
    
    # Network configuration
    network:
        # Use NetworkManager
        useNetworkManager: true
        # Auto-connect ethernet
        autoEthernet: true
        # WiFi setup
        wifiSetup: true
        # Hotspot for initial config
        initialHotspot: true
        hotspotSSID: "Stratara-Setup"
        hotspotPassword: ""
    
    # Xodus enrollment
    xodus:
        # Enroll with Xodus service
        enroll: true
        # Device name
        deviceName: "Stratara Living Room"
        # Device type
        deviceType: "living-room-shell"
        # Auto-register services
        autoRegisterServices: true
    
    # Display configuration
    display:
        # Resolution
        resolution: "1920x1080"
        # Refresh rate
        refreshRate: 60
        # Scale factor
        scale: 1.0
        # Overscan compensation
        overscan: 0
        # HDR
        hdr: false
    
    # Services to enable
    services:
        - "stratara.service"
        - "xodus.service"
        - "NetworkManager.service"
        - "bluetooth.service"
        - "pipewire.service"
        - "pipewire-pulse.service"
    
    # Post-setup script
    postSetupScript: "/usr/share/stratara/oem-setup.sh"

# Module dependencies
depends:
    - "install"
    - "users"

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"