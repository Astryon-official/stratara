# Stratara Shell Module
# Custom Calamares module for Stratara post-install configuration

name: "stratara-shell"
description: "Stratara shell post-install configuration (services, Wayland session, GRUB theme)"
version: "0.1.0"
author: "Astryon"

# Module type
type: "shell"

# Run after install module
order: "post-install"

# Configuration
config:
    # Enable services
    services:
        # User services (enabled per-user)
        user:
            - "stratara.service"
        
        # System services
        system:
            - "xodus.service"
            - "NetworkManager.service"
            - "bluetooth.service"
            - "pipewire.service"
            - "pipewire-pulse.service"
            - "dbus.service"
    
    # Wayland session setup
    wayland:
        # Enable Wayland session
        enabled: true
        # Default session
        defaultSession: "stratara"
        # Session file name
        sessionFile: "stratara.desktop"
        # KWin compositor
        compositor: "kwin_wayland"
    
    # KWin configuration
    kwin:
        # Copy KWin config to system
        systemConfig: true
        # Copy KWin config to user
        userConfig: true
        # Config files
        configFiles:
            - "kwinrc"
            - "windowrulesrc"
        # Scripts
        scripts:
            - "stratara-shell"
    
    # GRUB theme
    grub:
        # Enable custom theme
        enabled: true
        # Theme name
        themeName: "stratara"
        # Theme path
        themePath: "/usr/share/grub/themes/stratara"
        # Timeout
        timeout: 5
        # Resolution
        resolution: "1920x1080"
        # Background
        background: "grub-bg.png"
    
    # Secure Boot
    secureBoot:
        # Enable Secure Boot support
        enabled: false
        # Shim path
        shimPath: "/usr/share/shim/shimx64.efi"
        # MOK management
        mokManager: true
    
    # Xodus enrollment
    xodus:
        # Enroll after install
        enroll: true
        # Device name
        deviceName: "Stratara Living Room"
        # Device type
        deviceType: "living-room-shell"
    
    # Default user setup
    defaultUser:
        # Create default user
        create: true
        # Username
        username: "stratara"
        # Groups
        groups:
            - "wheel"
            - "audio"
            - "video"
            - "network"
            - "input"
            - "kvm"
            - "render"
        # Auto-login
        autologin: true
        # Password (empty = no password)
        password: ""
    
    # Post-install scripts
    scripts:
        - "/usr/lib/stratara/post-install.sh"

# Module dependencies
depends:
    - "install"
    - "users"

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"