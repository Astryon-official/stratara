# Keyboard module configuration for Stratara OS

# Required page
required: true

# Show only layouts (not variants)
layoutsOnly: false

# Default keyboard model
model: "pc105"

# Default layout
defaultLayout: "us"

# Default variant
defaultVariant: ""

# Show layout preview
showPreview: true

# Show variant selector
showVariant: true

# Enable keyboard testing
testLayout: true

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"

# Controller/TV-friendly layouts
preferredLayouts:
    - "us"
    - "gb"
    - "de"
    - "fr"
    - "es"
    - "it"
    - "jp"
    - "cn"
    - "kr"