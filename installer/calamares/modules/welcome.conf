# Welcome module configuration for Stratara OS

# Title shown on the welcome page
title: "Welcome to Stratara OS"

# Description text
description: |
    Stratara OS is a Linux-native living-room shell designed for TV and controller-based interaction.
    This installer will guide you through the installation process.

# Label for the next button
nextLabel: "Install Stratara OS"

# Label for the quit button
quitLabel: "Quit"

# Show keyboard selector on welcome page
showKeyboard: true

# Show language selector on welcome page
showLanguage: true

# Background image (relative to branding directory)
background: "welcome-bg.png"

# Logo image (relative to branding directory)
logo: "stratara-logo.svg"

# Text color
textColor: "#ffffff"

# Button colors
buttonColor: "#00aaff"
buttonTextColor: "#ffffff"

# Enable OEM mode button
oemButton: true
oemButtonLabel: "OEM Install (Factory Mode)"
oemButtonDescription: "Install for OEM deployment with first-boot setup"

# Live mode button
liveButton: true
liveButtonLabel: "Try Stratara OS (Live)"
liveButtonDescription: "Run Stratara OS without installing"