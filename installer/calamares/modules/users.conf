# Users module configuration for Stratara OS

# Required page
required: true

# Default groups for the user
defaultGroups:
    - "wheel"
    - "audio"
    - "video"
    - "network"
    - "input"
    - "kvm"
    - "render"

# Default username
defaultUser: "stratara"

# Username validation
username:
    minLength: 2
    maxLength: 32
    allowUppercase: false
    allowSpaces: false
    regex: "^[a-z][a-z0-9_-]*$"

# Real name validation
realName:
    minLength: 1
    maxLength: 128
    allowEmpty: false

# Password settings
password:
    minLength: 6
    maxLength: 64
    strength: true
    showStrength: true
    requireComplexity: false

# Auto-login option
autologin: true
autologinDefault: true

# Password visibility toggle
showPassword: true

# Password confirmation
confirmPassword: true

# Skip user creation (for OEM mode)
skipUserCreation: false

# Text color
textColor: "#ffffff"

# Highlight color
highlightColor: "#00aaff"

# Error color
errorColor: "#ff4444"