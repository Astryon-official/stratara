# Calamares settings for Stratara OS
# This file configures the Calamares installer framework

# Installer window title
windowTitle: "Stratara OS Installer"

# Window icon
windowIcon: "stratara.svg"

# Application name
applicationName: "Stratara OS Installer"

# Version
version: "0.1.0"

# Show the "About" button
aboutButton: true

# Show the "Quit" button
quitButton: true

# Window size
windowWidth: 800
windowHeight: 600

# Window position (center on screen)
windowPosition: "center"

# Module settings
modules-search: [
    "libcalamares_modules",
    "src/modules"
]

# Modules to load and their order
# Core modules
modules:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
    - install
    - finished

# Branding
branding: "stratara"

# Requirements
# These are checked before installation can proceed
requirements:
    - requiredStorage: 8.0  # GB
    - requiredRam: 1.0      # GB
    - requiredInternet: false
    - requiredRoot: true

# Keyboard layout for the installer UI
keyboard:
    - "us"

# Locale for the installer UI
locale:
    - "en_US"

# Skip pages if values are pre-set
skipInstallIfFailed: false

# Prompt for confirmation before installing
confirmInstallation: true

# Show progress details during install
showProgressDetails: true

# Allow switching keyboard layout in welcome screen
welcomeKeyboard: true

# Welcome screen settings
welcome:
    label:
        text: "Welcome to the Stratara OS Installer"
    description: >
        This installer will guide you through the installation of Stratara OS,
        a Linux-native living-room shell designed for TV and controller-based interaction.
    buttons:
        - label: "Install Stratara OS"
          icon: "system-software-install"
          action: "next"
        - label: "Try Stratara OS (Live)"
          icon: "system-run"
          action: "live"

# Locale module settings
locale:
    required: true
    showAllLocales: false
    regions:
        - "Africa"
        - "America"
        - "Antarctica"
        - "Arctic"
        - "Asia"
        - "Atlantic"
        - "Australia"
        - "Europe"
        - "Indian"
        - "Pacific"

# Keyboard module settings
keyboard:
    required: true
    layoutsOnly: false
    model: "pc105"

# Partition module settings
partition:
    required: true
    mountPointChoices:
        - "/"
        - "/boot"
        - "/home"
        - "/var"
        - "swap"
    filesystemChoices:
        - "ext4"
        - "btrfs"
        - "xfs"
        - "f2fs"
    defaultFilesystem: "ext4"
    minimumSize: 8.0  # GB
    recommendSize: 20.0  # GB
    allowUnmountedBoot: false
    allowUnmountedHome: false

# Users module settings
users:
    required: true
    defaultGroups:
        - "wheel"
        - "audio"
        - "video"
        - "network"
        - "input"
        - "kvm"
        - "render"
    # Default user for live/OEM mode
    defaultUser: "stratara"
    # Password settings
    password:
        minLength: 6
        maxLength: 64
        strength: true
    # Auto-login option
    autologin: true
    # Ask for password
    askPassword: true

# Summary module settings
summary:
    required: true
    showInstallLog: true
    showInstallDetails: true

# Install module settings
install:
    required: true
    # Use rsync for copying
    useRsync: true
    # Show progress
    showProgress: true
    # Verify after copy
    verify: true

# Finished module settings
finished:
    required: true
    # Reboot options
    rebootNow: true
    rebootLater: true
    # Show log
    showLog: true
    # Restart message
    message: "Stratara OS has been successfully installed. Please restart your computer to start using it."

# Global settings
globalstorage:
    # Keys that can be accessed by modules
    - "rootMountPoint"
    - "bootMountPoint"
    - "homeMountPoint"
    - "efiMountPoint"
    - "username"
    - "realName"
    - "password"
    - "autologin"
    - "timezone"
    - "locale"
    - "keyboardLayout"
    - "keyboardVariant"
    - "hostname"

# OEM installation settings
oem:
    enabled: true
    # User setup during first boot
    firstBootUser: true
    # Skip user creation during install
    skipUserCreation: false
    # Run custom script after install
    postInstallScript: "/usr/share/stratara/oem-setup.sh"

# Network configuration (for post-install)
network:
    enabled: true
    manageNetwork: true
    # Use NetworkManager
    useNetworkManager: true

# Bootloader settings
bootloader:
    grub:
        timeout: 5
        resolution: "1920x1080"
        theme: "/usr/share/grub/themes/stratara/theme.txt"
        # EFI support
        efi: true
        # Secure Boot
        secureBoot: false