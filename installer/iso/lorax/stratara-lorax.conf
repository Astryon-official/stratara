# Lorax configuration for Stratara OS ISO
# This file defines the ISO build using lorax (Fedora/RHEL style)

[General]
# Product information
product_name = Stratara OS
version = 0.1.0
release = 1
arch = x86_64

# Repository configuration
[Repositories]
# Base repository
base = https://download.opensuse.org/distribution/leap/15.6/repo/oss/
updates = https://download.opensuse.org/update/leap/15.6/oss/
kde = https://download.opensuse.org/repositories/KDE:/Frameworks6/openSUSE_Leap_15.6/

# Package groups
[PackageGroups]
# Core system
core = systemd,systemd-sysvinit,bash,coreutils,util-linux,grep,sed,awk,findutils,tar,gzip,bzip2,xz,cpio,rpm,zypper

# Kernel
kernel = kernel-default,kernel-firmware-all,dracut,grub2,grub2-efi,shim,mokutil

# Graphics
graphics = Mesa,Mesa-dri,Mesa-libEGL1,Mesa-libGL1,Mesa-libgbm1,wayland,wayland-protocols,libwayland-client0,libwayland-server0,libwayland-egl1,libdrm,libdrm-amdgpu1,libdrm-intel1,libdrm-nouveau2,libdrm-radeon1

# KWin/Plasma
kwin = kwin,kwin-wayland,kwin-x11,plasma-workspace,plasma-workspace-wayland,kwayland-integration,kwayland-server,kwin5,kwrited,kscreenlocker,plasma-desktop,systemsettings

# Qt6
qt6 = qt6-qtbase,qt6-qtdeclarative,qt6-qtquickcontrols2,qt6-qtsvg,qt6-qtwayland,qt6-qtshadertools

# KDE Frameworks
kde = kf6-kcoreaddons,kf6-ki18n,kf6-kconfig,kf6-kconfigwidgets,kf6-kdbusaddons,kf6-kglobalaccel,kf6-kwindowsystem,kf6-kwayland,kf6-kirigami2,kf6-kiconthemes,kf6-kitemviews,kf6-kcompletion,kf6-kcodecs,kf6-kwidgetsaddons,kf6-kguiaddons,kf6-kio-core,kf6-kio-filewidgets,kf6-kio-widgets,kf6-kio-gui,kf6-solid,kf6-sonnet,kf6-ktextwidgets,kf6-kxmlgui,kf6-kbookmarks,kf6-knotifications,kf6-kjobwidgets,kf6-kded,kf6-kcrash

# System integration
system = NetworkManager,NetworkManager-wifi,NetworkManager-bluetooth,bluez,bluez-tools,pipewire,pipewire-pulseaudio,pipewire-alsa,pipewire-jack,pipewire-v4l2,wireplumber,libpipewire-0_3-0,spa-plugins,gstreamer-plugin-pipewire

# Power
power = upower,udisks2,polkit,polkit-default-privs-standard,systemd-logind

# Input
input = libinput,libinput-tools,qtvirtualkeyboard,qtvirtualkeyboard-lang

# Display
display = xorg-x11-server,xorg-x11-server-wayland,xwayland

# Fonts
fonts = google-noto-sans-fonts,google-noto-mono-fonts,google-noto-emoji-fonts,dejavu-fonts,liberation-fonts

# Stratara
stratara = stratara,xodus

# Calamares
calamares = calamares,calamares-branding-stratara,calamares-module-stratara-shell

# Utilities
utils = sudo,vim,nano,htop,curl,wget,iproute2,iptables,firewalld,chrony,haveged,rng-tools

# Hardware
hardware = linux-firmware,intel-ucode,amd-ucode,kernel-firmware-amdgpu,kernel-firmware-i915,kernel-firmware-nvidia,kernel-firmware-network,kernel-firmware-sound

# Bootloader
bootloader = grub2-efi,grub2-branding-openSUSE,shim,mokutil,efibootmgr

# Initrd
initrd = dracut,dracut-systemd,dracut-network,dracut-crypt,dracut-lvm

# ISO settings
[ISO]
label = Stratara-OS-0.1.0
publisher = Astryon
application = Stratara OS Installer
volid = Stratara-OS
output = /tmp/Stratara-OS-0.1.0-x86_64.iso

# Bootloader configuration
[Bootloader]
timeout = 5
resolution = 1920x1080
theme = /usr/share/grub/themes/stratara
cmdline = quiet splash=silent vt.global_cursor_default=0 loglevel=3 systemd.show_status=auto rd.udev.log_level=3

# Kernel command line
[KernelCmdline]
default = quiet splash=silent vt.global_cursor_default=0 loglevel=3 systemd.show_status=auto rd.udev.log_level=3
install = quiet splash=silent vt.global_cursor_default=0 loglevel=3 systemd.show_status=auto rd.udev.log_level=3 inst.stage2=hd:LABEL=Stratara-OS
live = quiet splash=silent vt.global_cursor_default=0 loglevel=3 systemd.show_status=auto rd.udev.log_level=3 rd.live.image

# Secure Boot
[SecureBoot]
enabled = true
shim = /usr/share/shim/shimx64.efi
mok = /usr/share/shim/mmx64.efi
grub = /boot/efi/EFI/opensuse/grubx64.efi

# Dracut configuration
[Dracut]
modules = systemd,network,crypt,lvm
compress = xz
hostonly = true
force = true
omit = plymouth,plymouth-theme

# Files to include
[Files]
/etc/kwinrc
/etc/kwinrulesrc
/usr/share/kwin/scripts/stratara-shell
/usr/share/wayland-sessions/stratara.desktop
/usr/share/grub/themes/stratara
/usr/lib/stratara/post-install.sh
/usr/lib/stratara/oem-setup.sh
/usr/lib/stratara/xodusctl

# Systemd services
[Services]
# System services
system = xodus.service,NetworkManager.service,bluetooth.service,pipewire.service,pipewire-pulse.service,dbus.service,sddm.service,chronyd.service,haveged.service,firewalld.service

# User services (enabled per-user)
user = stratara.service

# Users
[Users]
stratara = wheel,audio,video,network,input,kvm,render,/bin/bash,auto_login=true

# Build options
[Build]
compression = xz
checksum = sha256
threads = 8
keep_repos = true
tmpdir = /var/tmp/lorax

# Profile
[Profile]
name = stratara
description = Stratara OS - Linux-native living-room shell