# Stratara OS Dracut Configuration
# This file configures the initramfs for Stratara OS

# Dracut modules to include
add_dracutmodules+=" systemd "
add_dracutmodules+=" network "
add_dracutmodules+=" crypt "
add_dracutmodules+=" lvm "
add_dracutmodules+=" dm "
add_dracutmodules+=" kernel-modules "
add_dracutmodules+=" kernel-network-modules "
add_dracutmodules+=" i18n "
add_dracutmodules+=" ifcfg "
add_dracutmodules+=" drm "
add_dracutmodules+=" plymouth "

# Dracut modules to omit (save space)
omit_dracutmodules+=" resume "
omit_dracutmodules+=" fips "
omit_dracutmodules+=" biosdevname "
omit_dracutmodules+=" modsign "
omit_dracutmodules+=" ssh-client "
omit_dracutmodules+=" ssh-server "
omit_dracutmodules+=" syslog "
omit_dracutmodules+=" systemd-initrd "
omit_dracutmodules+=" systemd-networkd "
omit_dracutmodules+=" systemd-resolved "
omit_dracutmodules+=" systemd-timesyncd "
omit_dracutmodules+=" systemd-bootchart "
omit_dracutmodules+=" systemd-sysext "

# Compression
compress="xz"
compress_level=6

# Host-only initramfs (smaller)
hostonly="yes"
hostonly_cmdline="yes"

# Early microcode loading
early_microcode="yes"

# Force include specific kernel modules
force_drivers+=" amdgpu "
force_drivers+=" i915 "
force_drivers+=" nouveau "
force_drivers+=" nvidia "
force_drivers+=" qtvirtualkeyboard "
force_drivers+=" uinput "
force_drivers+=" evdev "
force_drivers+=" hid_generic "
force_drivers+=" usbhid "
force_drivers+=" btusb "
force_drivers+=" bluetooth "
force_drivers+=" rfkill "
force_drivers+=" cfg80211 "
force_drivers+=" mac80211 "
force_drivers+=" iwlwifi "
force_drivers+=" rtlwifi "
force_drivers+=" ath9k "
force_drivers+=" ath10k_pci "
force_drivers+=" brcmfmac "
force_drivers+=" brcmutil "
force_drivers+=" sdhci_pci "
force_drivers+=" mmc_block "

# Filesystem modules
force_drivers+=" ext4 "
force_drivers+=" btrfs "
force_drivers+=" xfs "
force_drivers+=" f2fs "
force_drivers+=" vfat "
force_drivers+=" exfat "
force_drivers+=" ntfs3 "

# Block device modules
force_drivers+=" nvme "
force_drivers+=" ahci "
force_drivers+=" usb_storage "
force_drivers+=" sd_mod "
force_drivers+=" sr_mod "
force_drivers+=" loop "
force_drivers+=" dm_mod "
force_drivers+=" dm_crypt "
force_drivers+=" dm_snapshot "
force_drivers+=" dm_mirror "
force_drivers+=" dm_raid "
force_drivers+=" dm_log "

# Network modules for live/install
force_drivers+=" e1000e "
force_drivers+=" igb "
force_drivers+=" ixgbe "
force_drivers+=" r8169 "
force_drivers+=" virtio_net "

# USB
force_drivers+=" usbcore "
force_drivers+=" usb_common "
force_drivers+=" ehci_hcd "
force_drivers+=" ehci_pci "
force_drivers+=" ohci_hcd "
force_drivers+=" ohci_pci "
force_drivers+=" uhci_hcd "
force_drivers+=" xhci_hcd "
force_drivers+=" xhci_pci "
force_drivers+=" usbhid "

# Input
force_drivers+=" atkbd "
force_drivers+=" psmouse "
force_drivers+=" hid_generic "
force_drivers+=" uinput "
force_drivers+=" evdev "

# Graphics
force_drivers+=" drm "
force_drivers+=" drm_kms_helper "
force_drivers+=" ttm "
force_drivers+=" fb_sys_fops "
force_drivers+=" syscopyarea "
force_drivers+=" sysfillrect "
force_drivers+=" sysimgblt "

# Firmware
install_items+=" /usr/lib/firmware/amdgpu/ "
install_items+=" /usr/lib/firmware/i915/ "
install_items+=" /usr/lib/firmware/nvidia/ "
install_items+=" /usr/lib/firmware/brcm/ "
install_items+=" /usr/lib/firmware/intel/ "
install_items+=" /usr/lib/firmware/rtlwifi/ "
install_items+=" /usr/lib/firmware/ath10k/ "
install_items+=" /usr/lib/firmware/ath9k/ "
install_items+=" /usr/lib/firmware/brcmfmac/ "
install_items+=" /usr/lib/firmware/rtl_bt/ "

# Systemd services in initrd
systemd_units+=" systemd-udev-settle.service "
systemd_units+=" systemd-udev-trigger.service "
systemd_units+=" systemd-remount-fs.service "
systemd_units+=" sysroot.mount "
systemd_units+=" initrd-root-fs.target "
systemd_units+=" initrd-parse-etc.service "
systemd_units+=" initrd-cleanup.service "
systemd_units+=" initrd-switch-root.service "
systemd_units+=" initrd-switch-root.target "
systemd_units+=" systemd-repart.service "

# Kernel command line for initrd
kernel_cmdline="rd.udev.log_level=3 rd.shell=0 rd.emergency=reboot rd.auto=1"

# Boot performance
kernel_cmdline+=" quiet loglevel=3 systemd.show_status=auto vt.global_cursor_default=0"

# Disable Plymouth in initrd (handled by main system)
kernel_cmdline+=" plymouth.enable=0"

# Stratara-specific initrd settings
kernel_cmdline+=" stratara.initrd=1"

# Secure Boot
kernel_cmdline+=" module.sig_enforce=1 lock_down=1"

# Disable unused features
kernel_cmdline+=" module_blacklist=pcspkr,floppy"

# Files to include in initrd
install_items+=" /etc/kwinrc "
install_items+=" /etc/kwinrulesrc "
install_items+=" /usr/share/kwin/scripts/stratara-shell/ "
install_items+=" /usr/share/wayland-sessions/stratara.desktop "
install_items+=" /usr/share/grub/themes/stratara/ "
install_items+=" /usr/lib/stratara/post-install.sh "
install_items+=" /usr/lib/stratara/oem-setup.sh "
install_items+=" /usr/lib/stratara/xodusctl "

# Configuration files
install_items+=" /etc/stratara/kernel-cmdline.txt "
install_items+=" /etc/stratara/dracut-stratara.conf "

# Directory creation
install_items+=" /run/stratara "
install_items+=" /var/lib/stratara "

# Locale
kernel_cmdline+=" locale=en_US.UTF-8 keymap=us"

# Timezone
kernel_cmdline+=" timezone=UTC"

# Verbose output for debugging (comment out for production)
# kernel_cmdline+=" debug rd.debug log_buf_len=1M"

# Secure Boot
kernel_cmdline+=" module.sig_enforce=1 lock_down=1"

# Disable unused hardware
kernel_cmdline+=" module_blacklist=pcspkr,floppy,sb_edac,edac_core"

# Power management
kernel_cmdline+=" intel_idle.max_cstate=1 i915.enable_dc=0"