name: Stratara Native Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Build Linux Native Components
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtdeclarative qtsvg qtwayland
          aqtversion: ==3.2.*

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgl1-mesa-dev libglib2.0-dev libinput-dev libudev-dev libwayland-dev libpipewire-0.3-dev libbluetooth-dev libnm-dev libupower-glib-dev libsystemd-dev

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Stratara components
        run: cmake --build build --parallel 2
